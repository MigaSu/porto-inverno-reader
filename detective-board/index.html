<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Порто-Инверно — Доска Расследования (1931)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
</head>
<body>

  <!-- Top Navigation HUD -->
  <header class="board-header">
    <div class="header-left">
      <a href="../index.html" class="back-link" title="Вернуться к архиву ридера и чтению хроник">
        <span>←</span> 📖 В архив ридера
      </a>
      <div class="board-title">
        <h1>Порто-Инверно <span class="badge-case">ДЕЛО № 10-1931</span></h1>
        <p>Криминальный синдикат Фишеров & Заговор в доках</p>
      </div>
    </div>

    <div class="header-controls">
      <button class="btn-ctrl" id="btn-zoom-in" title="Приблизить доску">🔍 +</button>
      <button class="btn-ctrl" id="btn-zoom-out" title="Отдалить доску">🔍 −</button>
      <button class="btn-ctrl" id="btn-reset-view" title="Вернуть исходный вид">🎯 Центр</button>
      <button class="btn-ctrl" id="btn-toggle-strings" title="Скрыть/показать красные нити">🧶 Нити: ВКЛ</button>
      <button class="btn-ctrl" id="btn-audio" title="Фоновый эмбиенс (дождь и винил)">📻 Звук</button>
    </div>
  </header>

  <!-- Corkboard Viewport & Canvas -->
  <div class="board-viewport" id="board-viewport">
    <div class="board-canvas" id="board-canvas">
      
      <!-- SVG Red Strings Layer -->
      <svg class="strings-svg" id="strings-svg"></svg>
      
      <!-- Items Container (Polaroids & Notes) -->
      <div class="board-items" id="board-items"></div>

    </div>
  </div>

  <!-- Bottom Instructions Pill -->
  <div class="help-pill">
    <span>🖐️ Зажмите мышь для перемещения по доске</span>
    <span>•</span>
    <span>🔍 Колесо мыши — зум</span>
    <span>•</span>
    <span>👆 Клик по фото/заметке — досье и улики</span>
  </div>

  <!-- Dossier Inspection Modal -->
  <div class="modal-overlay" id="dossier-modal">
    <div class="dossier-folder">
      <div class="folder-header">
        <div class="folder-stamp">ДЕЛО УГОЛОВНОГО РОЗЫСКА // CONFIDENTIAL</div>
        <button class="folder-close-btn" id="modal-close-btn" title="Закрыть папку">✕</button>
      </div>
      <div class="folder-body" id="modal-content">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Ambient Audio Generator / Synth -->
  <script src="board-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
